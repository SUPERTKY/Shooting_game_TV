<!doctype html>
<html lang="ja">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Screen Share Viewer</title>
    <script type="importmap">
      {
        "imports": {
          "firebase/app": "https://www.gstatic.com/firebasejs/10.12.5/firebase-app.js",
          "firebase/firestore": "https://www.gstatic.com/firebasejs/10.12.5/firebase-firestore.js"
        }
      }
    </script>
    <style>
      body { font-family: sans-serif; margin: 24px; }
      .row { display: flex; gap: 8px; flex-wrap: wrap; margin-bottom: 12px; }
      input { min-width: 280px; padding: 8px; }
      button { padding: 8px 12px; }
      #status { margin: 8px 0 16px; font-weight: 700; }
      video { width: 100%; max-width: 960px; background: #111; border-radius: 8px; }
    </style>
  </head>
  <body>
    <h1>受信側（視聴）</h1>
    <div class="row">
      <input id="sessionIdInput" type="text" placeholder="sessionId を入力" />
      <button id="connectBtn" type="button">接続</button>
    </div>
    <div id="status" aria-live="polite">未接続</div>
    <video id="remoteVideo" autoplay playsinline controls></video>

    <script type="module" src="./src/viewer.js"></script>
  </body>
</html>
